<!-- Fragment used by index.html to render the SEPP widget -->
<div class="card">
    <div class="card__header">
        <div class="flex items-center gap-sm">
            <h2 class="card__title mb-0">72(t) SEPP Withdrawal Planner</h2>
            <button class="btn btn--info" onclick="showInfoModal('sepp-overview')" aria-label="Learn about SEPP methods and calculations" title="Learn about SEPP methods and calculations">
                <i class="fas fa-info-circle"></i>
            </button>
        </div>
        <p class="card__subtitle">Calculate substantially equal periodic payments for early retirement withdrawals</p>
    </div>
    <div class="form-grid">
        <div class="form-group">
            <label class="form-label">Starting Age</label>
            <input type="number" id="startAge" value="40" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Starting Balance ($)</label>
            <input type="text" id="balance" value="500000" class="form-input" inputmode="numeric">
        </div>
        <div class="form-group">
            <label class="form-label">Annual Return (%)</label>
            <input type="number" id="growth" value="12" step="0.1" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">IRS Interest Rate (%)</label>
            <input type="number" id="irsRate" value="5" step="0.1" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Tax Withholding (%)</label>
            <input type="number" id="tax" value="30" class="form-input">
        </div>
    </div>
    <button onclick="calculateSEPP()" class="btn btn--primary btn--large" id="seppCalculateBtn">Generate SEPP Projection</button>
</div>

<div id="resultsArea"></div>

<!-- Modal for info popups -->
<div id="infoModal" class="modal modal--hidden" aria-hidden="true">
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <div class="modal__header">
            <h3 id="infoTitle" class="modal__title">Title</h3>
            <button class="modal__close" id="infoClose" aria-label="Close">✕</button>
        </div>
        <div id="infoContent">Content</div>
    </div>
</div>
